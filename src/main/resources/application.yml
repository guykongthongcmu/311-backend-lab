spring:
  application:
    name: 331-backend
    mvc:
      problemdetials:
        enabled: true
  profiles:
    active:
      - db
      - local
  datasource:
    url: jdbc:postgresql://localhost:5432/selabdb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB